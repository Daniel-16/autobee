<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#33506e"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="860" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#1a1a1a">Mission executor — phase state machine</text>

  <!-- ===== main happy-path arrows (drawn first, under boxes) ===== -->
  <g stroke="#33506e" stroke-width="2" marker-end="url(#ar)">
    <line x1="235" y1="126" x2="235" y2="150"/>
    <line x1="235" y1="208" x2="235" y2="232"/>
    <line x1="235" y1="290" x2="235" y2="314"/>
    <line x1="235" y1="372" x2="235" y2="396"/>
    <line x1="235" y1="454" x2="235" y2="478"/>
    <line x1="235" y1="536" x2="235" y2="560"/>
    <line x1="235" y1="618" x2="235" y2="642"/>
    <line x1="235" y1="700" x2="235" y2="724"/>
  </g>

  <!-- ===== abort rail (red dashed) ===== -->
  <line x1="400" y1="98" x2="400" y2="508" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="350" y1="98"  x2="400" y2="98"/>
    <line x1="350" y1="180" x2="400" y2="180"/>
    <line x1="350" y1="262" x2="400" y2="262"/>
    <line x1="350" y1="344" x2="400" y2="344"/>
    <line x1="350" y1="426" x2="400" y2="426"/>
    <line x1="350" y1="508" x2="400" y2="508"/>
  </g>
  <text x="408" y="92" font-size="12" font-weight="bold" fill="#c0392b">/mission_abort</text>
  <text x="408" y="107" font-size="10.5" fill="#c0392b">from any non-terminal phase</text>
  <!-- elbow from rail into emergency lane -->
  <polyline points="400,344 470,344 470,348 548,348" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arR)"/>

  <!-- ===== emergency lane arrows ===== -->
  <g stroke="#c0392b" stroke-width="2" marker-end="url(#arR)">
    <line x1="665" y1="376" x2="665" y2="404"/>
    <line x1="665" y1="464" x2="665" y2="492"/>
  </g>

  <!-- ============ MAIN PHASE BOXES ============ -->
  <!-- CLIMB -->
  <rect x="120" y="70" width="230" height="56" rx="6" fill="#eef2f7" stroke="#33506e" stroke-width="1.6"/>
  <text x="235" y="96" font-size="15" font-weight="bold" fill="#1a2b3c" text-anchor="middle">CLIMB</text>
  <text x="235" y="114" font-size="11" fill="#46627e" text-anchor="middle">rise to cruise altitude</text>
  <!-- SETTLE -->
  <rect x="120" y="152" width="230" height="56" rx="6" fill="#eef2f7" stroke="#33506e" stroke-width="1.6"/>
  <text x="235" y="178" font-size="15" font-weight="bold" fill="#1a2b3c" text-anchor="middle">SETTLE</text>
  <text x="235" y="196" font-size="11" fill="#46627e" text-anchor="middle">brief pause</text>
  <!-- TRANSIT_OUT (optional) -->
  <rect x="120" y="234" width="230" height="56" rx="6" fill="#fff8e8" stroke="#c9912b" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="235" y="260" font-size="15" font-weight="bold" fill="#8a6516" text-anchor="middle">TRANSIT_OUT</text>
  <text x="235" y="278" font-size="11" fill="#8a6516" text-anchor="middle">fly to landmark XY · landmark-only</text>
  <!-- SURVEY -->
  <rect x="120" y="316" width="230" height="56" rx="6" fill="#eef2f7" stroke="#33506e" stroke-width="1.6"/>
  <text x="235" y="342" font-size="15" font-weight="bold" fill="#1a2b3c" text-anchor="middle">SURVEY</text>
  <text x="235" y="360" font-size="11" fill="#46627e" text-anchor="middle">per-waypoint  YAW→i · FWD→i  (loop)</text>
  <!-- TRANSIT_HOME (optional) -->
  <rect x="120" y="398" width="230" height="56" rx="6" fill="#fff8e8" stroke="#c9912b" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="235" y="424" font-size="15" font-weight="bold" fill="#8a6516" text-anchor="middle">TRANSIT_HOME</text>
  <text x="235" y="442" font-size="11" fill="#8a6516" text-anchor="middle">fly back to takeoff · landmark-only</text>
  <!-- PRE_DESCEND -->
  <rect x="120" y="480" width="230" height="56" rx="6" fill="#eef2f7" stroke="#33506e" stroke-width="1.6"/>
  <text x="235" y="506" font-size="15" font-weight="bold" fill="#1a2b3c" text-anchor="middle">PRE_DESCEND</text>
  <text x="235" y="524" font-size="11" fill="#46627e" text-anchor="middle">hover so drift settles</text>
  <!-- DESCEND -->
  <rect x="120" y="562" width="230" height="56" rx="6" fill="#eef2f7" stroke="#33506e" stroke-width="1.6"/>
  <text x="235" y="588" font-size="15" font-weight="bold" fill="#1a2b3c" text-anchor="middle">DESCEND</text>
  <text x="235" y="606" font-size="11" fill="#46627e" text-anchor="middle">drop to ground</text>
  <!-- STOP -->
  <rect x="120" y="644" width="230" height="56" rx="6" fill="#eef2f7" stroke="#33506e" stroke-width="1.6"/>
  <text x="235" y="670" font-size="15" font-weight="bold" fill="#1a2b3c" text-anchor="middle">STOP</text>
  <text x="235" y="688" font-size="11" fill="#46627e" text-anchor="middle">zero-twist hold</text>
  <!-- DONE (terminal, double border) -->
  <rect x="116" y="722" width="238" height="60" rx="8" fill="none" stroke="#2e7d32" stroke-width="1.2"/>
  <rect x="120" y="726" width="230" height="52" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="235" y="750" font-size="15" font-weight="bold" fill="#1f5d23" text-anchor="middle">DONE</text>
  <text x="235" y="767" font-size="11" fill="#3a7d3f" text-anchor="middle">terminal — success</text>

  <!-- ============ EMERGENCY LANE ============ -->
  <text x="665" y="300" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">EMERGENCY_LAND branch</text>
  <!-- HOVER -->
  <rect x="550" y="320" width="230" height="56" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"/>
  <text x="665" y="346" font-size="14.5" font-weight="bold" fill="#922b21" text-anchor="middle">EMERGENCY_LAND_HOVER</text>
  <text x="665" y="364" font-size="11" fill="#a5392c" text-anchor="middle">1 s zero-twist</text>
  <!-- DESCEND -->
  <rect x="550" y="408" width="230" height="56" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"/>
  <text x="665" y="434" font-size="14.5" font-weight="bold" fill="#922b21" text-anchor="middle">EMERGENCY_LAND_DESCEND</text>
  <text x="665" y="452" font-size="11" fill="#a5392c" text-anchor="middle">drop to ground</text>
  <!-- FAILED (terminal, double border) -->
  <rect x="546" y="492" width="238" height="60" rx="8" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="550" y="496" width="230" height="52" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.8"/>
  <text x="665" y="520" font-size="15" font-weight="bold" fill="#922b21" text-anchor="middle">FAILED</text>
  <text x="665" y="537" font-size="11" fill="#a5392c" text-anchor="middle">terminal — aborted</text>

  <!-- ============ LEGEND ============ -->
  <rect x="550" y="600" width="320" height="118" rx="6" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
  <text x="566" y="622" font-size="13" font-weight="bold" fill="#1a1a1a">Legend</text>
  <rect x="566" y="634" width="22" height="14" rx="3" fill="#eef2f7" stroke="#33506e" stroke-width="1.6"/>
  <text x="596" y="645" font-size="11.5" fill="#333">required phase</text>
  <rect x="566" y="656" width="22" height="14" rx="3" fill="#fff8e8" stroke="#c9912b" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="596" y="667" font-size="11.5" fill="#333">optional — landmark-only (skipped if no landmark)</text>
  <rect x="566" y="678" width="22" height="14" rx="3" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"/>
  <text x="596" y="689" font-size="11.5" fill="#333">emergency / abort path</text>
  <rect x="564" y="698" width="26" height="16" rx="3" fill="none" stroke="#444" stroke-width="1"/>
  <rect x="567" y="701" width="20" height="10" rx="2" fill="#eef0f2" stroke="#444" stroke-width="1.4"/>
  <text x="596" y="710" font-size="11.5" fill="#333">terminal state (double border)</text>

  <!-- footnote: alternate skills -->
  <text x="40" y="812" font-size="11" fill="#666">Alternate skill schedules — scan_in_place: CLIMB · SETTLE · YAW_360 · SETTLE_POST_YAW · DESCEND · STOP · DONE.</text>
  <text x="40" y="828" font-size="11" fill="#666">return_home (already grounded): AT_HOME · DONE.   Failure before takeoff is reported as REJECTED / PLANNING (no flight).</text>
</svg>
