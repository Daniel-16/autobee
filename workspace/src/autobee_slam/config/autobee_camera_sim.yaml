%YAML:1.0

# ORB-SLAM3 settings file for the AutoBee Gazebo sim camera.
#
# Sim camera (autobee_drone/model.sdf):
#   width=640, height=480
#   horizontal_fov = 1.5708 rad (90 deg)
#   no distortion (Gazebo pinhole)
#
# Intrinsics from the pinhole model:
#   fx = fy = (width/2) / tan(fov/2) = 320 / tan(45 deg) = 320
#   cx = width/2 = 320
#   cy = height/2 = 240
#
# When porting to the real Tello, regenerate this file from a checkerboard
# calibration (see PRD §12 — never reuse sim intrinsics on real hardware).

File.version: "1.0"

Camera.type: "PinHole"
Camera1.fx: 320.0
Camera1.fy: 320.0
Camera1.cx: 320.0
Camera1.cy: 240.0

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

# --------------------------------------------------------------------------
# ORB feature extractor
# --------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# --------------------------------------------------------------------------
# Viewer (only used when use_viewer:=true)
# --------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
